name: Deploy

# Staging deploys on every push to main and must pass smoke and E2E tests against the live
# staging URL; production deploys only after that job succeeds.
# workflow_dispatch reruns the same staging-then-production chain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 6c7d0b1e88f13e6c5d34b5caeb580e3a
  STAGING_URL: https://neon-tide-staging.kristian-dermody-personal-account.workers.dev

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # no dependency cache in a job that holds deploy secrets
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --env staging
      - name: Smoke test staging
        run: npm run smoke -- "$STAGING_URL"
      # Split so a hang shows whether apt or the browser download stalled; time-boxed so a hang
      # fails fast instead of holding the deploy queue (a run on 2026-10-23 hung here 10+ minutes).
      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium webkit
        timeout-minutes: 5
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit
        timeout-minutes: 5
      - name: E2E against staging
        run: npm run e2e
        env:
          E2E_BASE_URL: ${{ env.STAGING_URL }}
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  production:
    needs: staging
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_URL: https://neon-tide.kristiandermody.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npx wrangler deploy --env production
      - name: Smoke test production
        run: npm run smoke -- "$PRODUCTION_URL"
