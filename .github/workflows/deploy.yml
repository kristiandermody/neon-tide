name: Deploy

# Staging deploys on every push to main; production deploys only after staging succeeds.
# workflow_dispatch reruns the same staging-then-production chain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 6c7d0b1e88f13e6c5d34b5caeb580e3a

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # no dependency cache in a job that holds deploy secrets
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --env staging

  production:
    needs: staging
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npx wrangler deploy --env production
